name: Testes Isadora
on:
  push:
    branches: [main]
  pull_request:
# Preserve a full CI result for every integrated main commit. Superseded
# commits on the same pull-request branch can still be cancelled safely.
concurrency:
  group: isadora-ci-${{ github.event_name }}-${{ github.event_name == 'push' && github.sha || github.head_ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  tests:
    runs-on: ubuntu-24.04  # Playwright 1.56 Chromium não suporta ubuntu-26.04
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-only-secret
          MYSQL_DATABASE: isadora_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-only-secret --silent"
          --health-interval=5s --health-timeout=3s --health-retries=20
    env:
      TEST_DATABASE_URL: mysql+pymysql://root:ci-only-secret@127.0.0.1:3306/isadora_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt -r requirements-ops.txt
      - run: python -m playwright install --with-deps chromium webkit
      - name: Check Python and browser JavaScript syntax
        run: |
          python -m compileall -q app scripts tests
          for source in app/static/*.js; do node --check "$source"; done
      - run: python -m pytest -q

      - name: One billion deterministic RSVP state operations (no HTTP traffic)
        run: |
          set -euo pipefail
          cc -std=c11 -O3 -Wall -Wextra -Werror tests/stress/rsvp_billion.c -o "$RUNNER_TEMP/isadora-rsvp-billion"
          timeout 120s "$RUNNER_TEMP/isadora-rsvp-billion" 1000000000 | tee "$RUNNER_TEMP/isadora-billion-results.txt"
          grep -F "PASS simulated_state_operations=1000000000 " "$RUNNER_TEMP/isadora-billion-results.txt"

      - name: Prepare disposable Compose credentials
        run: python scripts/generate_ci_env.py
      - name: Build and start Compose
        env:
          SOURCE_REVISION: ${{ github.sha }}
        run: docker compose up -d --build --wait
      - name: Verify running image revision against the checkout
        run: python scripts/check_deployed_revision.py --json
      - name: Read-only local acceptance smoke test
        run: python scripts/check_local.py --json
      - name: Verify Compose persistence and idempotency
        run: python scripts/check_persistence.py
      - name: Verify disposable MySQL restore
        run: |
          python scripts/backup_mysql.py backup --output "$RUNNER_TEMP/isadora-ci.sql.gz"
          python scripts/backup_mysql.py verify-restore --input "$RUNNER_TEMP/isadora-ci.sql.gz"
      - name: Verify authenticated encryption and restore from decrypted archive
        run: |
          set -euo pipefail
          export ISADORA_BACKUP_PASSPHRASE="$(python -c 'import secrets; print(secrets.token_urlsafe(40))')"
          python scripts/secure_backup.py encrypt --input "$RUNNER_TEMP/isadora-ci.sql.gz" --output "$RUNNER_TEMP/isadora-ci.sql.gz.isadora"
          python scripts/secure_backup.py decrypt --input "$RUNNER_TEMP/isadora-ci.sql.gz.isadora" --output "$RUNNER_TEMP/isadora-decrypted.sql.gz"
          cmp "$RUNNER_TEMP/isadora-ci.sql.gz" "$RUNNER_TEMP/isadora-decrypted.sql.gz"
          python scripts/backup_mysql.py verify-restore --input "$RUNNER_TEMP/isadora-decrypted.sql.gz"
          unset ISADORA_BACKUP_PASSPHRASE
      - name: Remove disposable backups
        if: always()
        run: rm -f "$RUNNER_TEMP/isadora-ci.sql.gz" "$RUNNER_TEMP/isadora-ci.sql.gz.isadora" "$RUNNER_TEMP/isadora-decrypted.sql.gz"
      - name: Stop test containers without deleting data volumes
        if: always()
        run: if [ -f .env ]; then docker compose down; fi

      - name: Assemble auditable source ZIP
        if: success()
        run: |
          git archive --format=zip --output "$RUNNER_TEMP/isadora-release-1-source.zip" HEAD
          python -c 'import sys, zipfile; files=set(zipfile.ZipFile(sys.argv[1]).namelist()); assert {"README.md","Dockerfile","compose.yaml","app/__init__.py","docs/release-handoff.md"} <= files; assert ".env" not in files; assert not any(p.endswith((".sql.gz",".isadora")) for p in files)' "$RUNNER_TEMP/isadora-release-1-source.zip"
          sha256sum "$RUNNER_TEMP/isadora-release-1-source.zip"
      - name: Attach tested source ZIP
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: isadora-release-1-source
          path: ${{ runner.temp }}/isadora-release-1-source.zip
          if-no-files-found: error
          retention-days: 30
