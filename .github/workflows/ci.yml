name: Testes Isadora
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: isadora-ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-24.04  # Playwright 1.56 Chromium não suporta ubuntu-26.04
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-only-secret
          MYSQL_DATABASE: isadora_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-only-secret --silent"
          --health-interval=5s --health-timeout=3s --health-retries=20
    env:
      TEST_DATABASE_URL: mysql+pymysql://root:ci-only-secret@127.0.0.1:3306/isadora_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt -r requirements-ops.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest -q

      - name: Prepare disposable Compose credentials
        run: python scripts/generate_ci_env.py
      - name: Build and start Compose
        run: docker compose up -d --build --wait
      - name: Verify Compose persistence and idempotency
        run: python scripts/check_persistence.py
      - name: Verify disposable MySQL restore
        run: |
          python scripts/backup_mysql.py backup --output "$RUNNER_TEMP/isadora-ci.sql.gz"
          python scripts/backup_mysql.py verify-restore --input "$RUNNER_TEMP/isadora-ci.sql.gz"
      - name: Verify authenticated encryption and restore from decrypted archive
        run: |
          set -euo pipefail
          export ISADORA_BACKUP_PASSPHRASE="$(python -c 'import secrets; print(secrets.token_urlsafe(40))')"
          python scripts/secure_backup.py encrypt --input "$RUNNER_TEMP/isadora-ci.sql.gz" --output "$RUNNER_TEMP/isadora-ci.sql.gz.isadora"
          python scripts/secure_backup.py decrypt --input "$RUNNER_TEMP/isadora-ci.sql.gz.isadora" --output "$RUNNER_TEMP/isadora-decrypted.sql.gz"
          cmp "$RUNNER_TEMP/isadora-ci.sql.gz" "$RUNNER_TEMP/isadora-decrypted.sql.gz"
          python scripts/backup_mysql.py verify-restore --input "$RUNNER_TEMP/isadora-decrypted.sql.gz"
          unset ISADORA_BACKUP_PASSPHRASE
      - name: Remove disposable backups
        if: always()
        run: rm -f "$RUNNER_TEMP/isadora-ci.sql.gz" "$RUNNER_TEMP/isadora-ci.sql.gz.isadora" "$RUNNER_TEMP/isadora-decrypted.sql.gz"
      - name: Stop test containers without deleting data volumes
        if: always()
        run: if [ -f .env ]; then docker compose down; fi
