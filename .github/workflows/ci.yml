name: Testes Isadora
on:
  push:
    branches: [main, feat/isadora-release-1]
  pull_request:
concurrency:
  group: isadora-ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-only-secret
          MYSQL_DATABASE: isadora_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-only-secret --silent"
          --health-interval=5s --health-timeout=3s --health-retries=20
    env:
      TEST_DATABASE_URL: mysql+pymysql://root:ci-only-secret@127.0.0.1:3306/isadora_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest -q

      - name: Prepare disposable Compose credentials
        run: python scripts/generate_ci_env.py
      - name: Build and start Compose
        run: docker compose up -d --build --wait
      - name: Verify Compose persistence and idempotency
        run: python scripts/check_persistence.py
      - name: Stop test containers without deleting data volumes
        if: always()
        run: docker compose down
